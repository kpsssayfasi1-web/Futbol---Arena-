
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Football Arena</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b16;font-family:Arial,sans-serif;color:white}
canvas{display:block;width:100vw;height:100dvh}
#tag{position:fixed;top:4%;left:50%;transform:translateX(-50%);text-align:center;width:90%;pointer-events:none}
#tag small{letter-spacing:5px;color:#8fffd1;font-size:10px}
#tag h1{margin:8px 0;font-size:clamp(22px,6vw,38px);font-style:italic;letter-spacing:2px;text-shadow:0 0 20px #16e8bb}
#score{position:fixed;top:17%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:12px 20px;background:#081627d9;border:1px solid #5bfbd577;border-radius:18px;box-shadow:0 0 28px #00ffc022;white-space:nowrap}
.team{font-size:12px;font-weight:bold;letter-spacing:1px}
.num{font-size:30px;font-weight:900}
#clock{font-size:11px;color:#a9c4d7;text-align:center}
#bottom{position:fixed;bottom:4%;left:50%;transform:translateX(-50%);width:86%;max-width:420px;text-align:center;padding:15px;background:linear-gradient(110deg,#0b2033ed,#10132bed);border:1px solid #7bffe155;border-radius:18px;box-shadow:0 0 30px #00ffc018}
#bottom strong{letter-spacing:2px;font-size:13px}
#bottom p{margin:7px 0 0;color:#9bb5c7;font-size:10px;letter-spacing:2px}
#hint{position:fixed;bottom:1%;width:100%;text-align:center;color:#55758a;font-size:9px;letter-spacing:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag"><small>ULTIMATE MATCH EXPERIENCE</small><h1>FOOTBALL ARENA</h1></div>
<div id="score">
  <div class="team"><span style="color:#ff5576">RED</span><br><span class="num" id="s1">0</span></div>
  <div id="clock">LIVE MATCH<br><b id="time">00:00</b></div>
  <div class="team" style="text-align:right"><span style="color:#54cfff">BLUE</span><br><span class="num" id="s2">0</span></div>
</div>
<div id="bottom"><strong>⚡ THE BATTLE BEGINS ⚡</strong><p>POWER • PRECISION • GLORY</p></div>
<div id="hint">MOBILE ARENA · LIVE SIMULATION</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,dpr,t=0,last=0,score1=0,score2=0,particles=[];
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);resize();
const balls=[
 {x:.36,y:.49,vx:.0024,vy:.0017,r:17,color:'#ff345d',glow:'#ff345d',spin:0},
 {x:.64,y:.49,vx:-.0021,vy:-.0015,r:17,color:'#28c8ff',glow:'#28c8ff',spin:0}
];
function burst(px,py,col){
 for(let i=0;i<24;i++){
  let a=Math.random()*Math.PI*2,s=1+Math.random()*4;
  particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col});
 }
}
function ball(b){
 let px=b.x*W,py=b.y*H, r=b.r;
 x.save();x.translate(px,py);x.rotate(b.spin);
 x.shadowColor=b.glow;x.shadowBlur=24;
 let g=x.createRadialGradient(-r*.35,-r*.4,1,0,0,r);
 g.addColorStop(0,'#ffffff');g.addColorStop(.22,b.color);g.addColorStop(1,'#091321');
 x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.fill();
 x.shadowBlur=0;x.strokeStyle='#ffffffcc';x.lineWidth=1.3;
 x.beginPath();x.arc(0,0,r*.55,0,Math.PI*2);x.stroke();
 for(let i=0;i<5;i++){
  let a=i*Math.PI*2/5;
  x.beginPath();x.moveTo(Math.cos(a)*r*.2,Math.sin(a)*r*.2);
  x.lineTo(Math.cos(a)*r*.52,Math.sin(a)*r*.52);x.stroke();
 }
 x.restore();
}
function draw(now){
 let dt=Math.min(now-last,32);last=now;t+=dt;
 x.clearRect(0,0,W,H);
 let bg=x.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,'#071425');bg.addColorStop(.55,'#102b3d');bg.addColorStop(1,'#030811');
 x.fillStyle=bg;x.fillRect(0,0,W,H);
 // Stadium lights
 for(let i=0;i<18;i++){
  let px=W*i/17,py=H*.28+Math.sin(i*2)*H*.025;
  let g=x.createRadialGradient(px,py,1,px,py,W*.09);
  g.addColorStop(0,'#78ffe522');g.addColorStop(1,'#78ffe500');
  x.fillStyle=g;x.fillRect(px-W*.09,py-W*.09,W*.18,W*.18);
 }
 // Arena geometry
 let cx=W*.5,cy=H*.51,rx=Math.min(W*.42,H*.245),ry=rx*.92;
 x.save();x.translate(cx,cy);
 x.shadowColor='#13ffd0';x.shadowBlur=35;
 x.strokeStyle='#28f5d5';x.lineWidth=2;x.beginPath();x.ellipse(0,0,rx,ry,0,0,Math.PI*2);x.stroke();
 x.shadowBlur=0;
 for(let k=1;k<=5;k++){
  x.strokeStyle=`rgba(66,235,220,${.15-k*.018})`;x.lineWidth=1;
  x.beginPath();x.ellipse(0,0,rx*k/5,ry*k/5,0,0,Math.PI*2);x.stroke();
 }
 // Moving striped arc
 let a=t*.001;
 x.lineWidth=7;x.strokeStyle='#a0fff4';x.shadowColor='#25ffe2';x.shadowBlur=20;
 x.beginPath();x.ellipse(0,0,rx,ry,a,a+1.0);x.stroke();x.shadowBlur=0;
 // Orbit ticks
 for(let i=0;i<72;i++){
  let q=i*Math.PI*2/72,inner=rx-((i%6===0)?12:5);
  x.strokeStyle=i%6===0?'#9bfff0':'#3a8e94';
  x.lineWidth=i%6===0?2:1;
  x.beginPath();x.moveTo(Math.cos(q)*inner,Math.sin(q)*ry/rx*inner);
  x.lineTo(Math.cos(q)*rx,Math.sin(q)*ry);x.stroke();
 }
 x.restore();
 // Ball movement
 for(let b of balls){
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.spin+=dt*.003;
  let dx=(b.x-.5)*W,dy=(b.y-.51)*H;
  if(Math.abs(dx)>rx-b.r){b.vx*=-1;b.x+=b.vx*dt*2;burst(b.x*W,b.y*H,b.color)}
  if(Math.abs(dy)>ry-b.r){b.vy*=-1;b.y+=b.vy*dt*2;burst(b.x*W,b.y*H,b.color)}
 }
 let dx=(balls[0].x-balls[1].x)*W,dy=(balls[0].y-balls[1].y)*H;
 if(Math.hypot(dx,dy)<balls[0].r+balls[1].r){
  [balls[0].vx,balls[1].vx]=[balls[1].vx,balls[0].vx];
  [balls[0].vy,balls[1].vy]=[balls[1].vy,balls[0].vy];
  burst((balls[0].x+balls[1].x)*W/2,(balls[0].y+balls[1].y)*H/2,'#ffffff');
 }
 for(let p of particles){
  p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.life-=.025;
  x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.col;
  x.shadowColor=p.col;x.shadowBlur=10;x.beginPath();x.arc(p.x,p.y,2.5*p.life,0,Math.PI*2);x.fill();
 }
 x.globalAlpha=1;x.shadowBlur=0;particles=particles.filter(p=>p.life>0);
 balls.forEach(ball);
 document.getElementById('time').textContent=
  String(Math.floor(t/1000/60)).padStart(2,'0')+':'+String(Math.floor(t/1000)%60).padStart(2,'0');
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
