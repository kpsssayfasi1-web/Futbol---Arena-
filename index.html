
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08121b">
<title>Football Arena Pro</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08121b;color:#fff;font-family:Arial,Helvetica,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:2;pointer-events:none}
.top{top:4%;left:50%;transform:translateX(-50%);width:94%;max-width:470px;display:flex;align-items:center;justify-content:space-between;gap:5px;padding:9px 7px;border-radius:12px;background:#f5f7f7f5;color:#17212a;box-shadow:0 5px 24px #0005}
.team{display:flex;align-items:center;gap:5px;min-width:0}
.teamname{font-size:clamp(7px,2vw,10px);font-weight:900;white-space:nowrap}
.crest{width:clamp(22px,6vw,30px);height:clamp(22px,6vw,30px);display:grid;place-items:center;flex-shrink:0;font-size:9px;font-weight:900;clip-path:polygon(50% 0,94% 18%,86% 74%,50% 100%,14% 74%,6% 18%)}
.gs{background:linear-gradient(90deg,#a20d2b 0 50%,#f0ca42 50%);color:#fff}
.fcb{background:linear-gradient(90deg,#173879 0 48%,#a91f35 48% 73%,#f1c53b 73%);color:#fff}
.score{min-width:25px;text-align:center;color:#fff;background:#b91f3c;border-radius:5px;padding:5px 4px;font-size:16px;font-weight:900}
.away .score{background:#e5bd35;color:#17212a}
.clock{font-size:10px;font-weight:900;text-align:center;padding:6px 4px;color:#34414a;background:#e9eeee;border-radius:5px;white-space:nowrap}
.kicker{top:13%;left:0;width:100%;text-align:center;font-size:8px;letter-spacing:3px;color:#edf7f7;opacity:.9;text-shadow:0 2px 8px #000}
.bottom{bottom:8%;left:50%;transform:translateX(-50%);width:80%;max-width:380px;min-height:58px;border:1px solid #ffffff9c;border-radius:12px;background:linear-gradient(110deg,#ffffffef,#e9eff0ed);color:#17252c;display:flex;align-items:center;justify-content:space-evenly;padding:8px;box-shadow:0 5px 22px #0004}
.mini{display:flex;flex-direction:column;align-items:center;gap:4px}
.mini .crest{width:23px;height:23px}
.mini span{font-size:7px;font-weight:900}
.event{text-align:center;font-size:9px;font-weight:900;line-height:1.7}
.event small{font-size:7px;color:#58656b;font-weight:700}
.footer{bottom:4.5%;left:0;width:100%;text-align:center;color:#f0f6f6;font-size:7px;letter-spacing:2px;opacity:.8}
#goal{position:absolute;z-index:4;left:0;top:41%;width:100%;text-align:center;font-weight:900;font-style:italic;font-size:clamp(30px,9vw,60px);letter-spacing:2px;color:#fff;opacity:0;pointer-events:none;text-shadow:0 0 10px #fff,0 0 32px #f4d66c}
#goal.show{animation:goalflash 1.4s ease-out}
@keyframes goalflash{0%{opacity:0;transform:scale(.55)}15%{opacity:1;transform:scale(1.18);filter:brightness(1.8)}35%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.25)}}
@media(max-height:700px){.kicker{top:12%}.bottom{bottom:7%;min-height:48px}.footer{bottom:3.5%}}
</style>
</head>
<body>
<canvas id="arena"></canvas>

<div class="hud top">
 <div class="team"><div class="crest gs">GS</div><span class="score" id="red">0</span><span class="teamname">GALATASARAY</span></div>
 <div class="clock" id="timer">00:00</div>
 <div class="team away"><span class="teamname">BARCELONA</span><span class="score" id="blue">0</span><div class="crest fcb">FCB</div></div>
</div>
<div class="hud kicker">FOOTBALL ARENA · MATCH NIGHT</div>
<div class="hud bottom">
 <div class="mini"><div class="crest gs">GS</div><span>GALATASARAY</span></div>
 <div class="event">ARENA CUP<br><small>LIVE SIMULATION</small></div>
 <div class="mini"><div class="crest fcb">FCB</div><span>BARCELONA</span></div>
</div>
<div class="hud footer">FOOTBALL ARENA PRO · LIVE SIMULATION</div>
<div id="goal">GOOOL!</div>

<script>
(()=>{
'use strict';

const canvas=document.getElementById('arena');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;

let W=0,H=0,DPR=1,last=0,elapsed=0;
let particles=[],stars=[],shake=0,flash=0;
let scores=[0,0],lastGoal=-10,lastCollision=-1;

function resize(){
 W=innerWidth;H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*DPR);
 canvas.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 stars=Array.from({length:100},()=>({
  x:Math.random()*W,y:Math.random()*H*.7,
  r:.4+Math.random()*1.1,p:Math.random()*TAU
 }));
}
addEventListener('resize',resize);
resize();

function geometry(){
 const r=Math.min(W*.405,H*.215);
 return {cx:W*.5,cy:H*.505,r};
}

const balls=[
 {x:.37,y:.47,vx:148,vy:105,r:Math.max(8,Math.min(13,W*.026)),color:'#d91d37',dark:'#651020',accent:'#f3ce40',spin:0,trail:[],team:0},
 {x:.63,y:.52,vx:-162,vy:-95,r:Math.max(8,Math.min(13,W*.026)),color:'#1b4da8',dark:'#091d55',accent:'#e8c733',spin:1,trail:[],team:1}
];

function line(x1,y1,x2,y2,color,width=1){
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
}

function background(t){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#08111e');g.addColorStop(.24,'#253945');
 g.addColorStop(.47,'#243c43');g.addColorStop(.72,'#172d31');g.addColorStop(1,'#050b12');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 ctx.save();ctx.filter='blur(9px)';
 ctx.fillStyle='#344b56';ctx.beginPath();ctx.moveTo(0,H*.27);
 ctx.quadraticCurveTo(W*.5,H*.08,W,H*.27);ctx.lineTo(W,H*.43);
 ctx.quadraticCurveTo(W*.5,H*.25,0,H*.43);ctx.closePath();ctx.fill();
 ctx.fillStyle='#172b35';ctx.fillRect(0,H*.31,W,H*.15);ctx.restore();

 for(let i=0;i<260;i++){
  const x=(i*47.7)%W,y=H*(.30+((i*31)%100)/100*.15);
  ctx.globalAlpha=.12+((i*7)%9)*.025;
  ctx.fillStyle=i%5===0?'#f8d99a':i%3===0?'#d8fbff':'#9aabb5';
  ctx.fillRect(x,y,1.5,1.8);
 }
 ctx.globalAlpha=1;ctx.save();ctx.globalCompositeOperation='screen';
 for(let i=0;i<4;i++){
  const sx=W*(.12+i*.25),ex=sx+Math.sin(t*.00025+i)*W*.12;
  const grad=ctx.createLinearGradient(sx,H*.22,ex,H*.59);
  grad.addColorStop(0,'rgba(205,250,255,.12)');grad.addColorStop(1,'rgba(205,250,255,0)');
  ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(sx-5,H*.22);
  ctx.lineTo(ex-W*.1,H*.59);ctx.lineTo(ex+W*.1,H*.59);ctx.closePath();ctx.fill();
 }
 ctx.restore();

 const field=ctx.createLinearGradient(0,H*.53,0,H);
 field.addColorStop(0,'#1a3337');field.addColorStop(.45,'#0e242b');field.addColorStop(1,'#050b12');
 ctx.fillStyle=field;ctx.fillRect(0,H*.53,W,H*.47);
 for(let i=0;i<10;i++)line(0,H*(.56+i*i*.004),W,H*(.56+i*i*.004),'rgba(190,244,245,.045)');
 stars.forEach(s=>{
  ctx.globalAlpha=.13+.25*(.5+.5*Math.sin(t*.001+s.p));
  ctx.fillStyle='#d9ffff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();
 });
 ctx.globalAlpha=1;
}

function drawArena(t){
 const {cx,cy,r}=geometry();
 const halo=ctx.createRadialGradient(cx,cy,r*.78,cx,cy,r*1.3);
 halo.addColorStop(0,'rgba(125,255,244,0)');halo.addColorStop(.78,'rgba(125,255,244,.035)');halo.addColorStop(1,'rgba(125,255,244,0)');
 ctx.fillStyle=halo;ctx.fillRect(cx-r*1.4,cy-r*1.4,r*2.8,r*2.8);

 ctx.save();ctx.shadowColor='#d9fff8';ctx.shadowBlur=15+flash*20;
 ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.strokeStyle='rgba(245,255,255,.93)';
 ctx.lineWidth=2.3+flash;ctx.stroke();ctx.restore();
 ctx.beginPath();ctx.arc(cx,cy,r-4,0,TAU);ctx.strokeStyle='rgba(255,255,255,.17)';ctx.lineWidth=.7;ctx.stroke();

 for(let i=0;i<72;i++){
  const a=i*TAU/72,major=i%6===0,inner=r-(major?10:4);
  line(cx+Math.cos(a)*inner,cy+Math.sin(a)*inner,cx+Math.cos(a)*r,cy+Math.sin(a)*r,major?'rgba(255,255,255,.42)':'rgba(255,255,255,.13)',major?1:.6);
 }

 const a=t*.00055-1.0;
 const gx=cx+Math.cos(a)*r,gy=cy+Math.sin(a)*r;
 const angle=a+Math.PI/2,gw=Math.max(25,r*.29),gh=Math.max(11,r*.13);
 ctx.save();ctx.translate(gx,gy);ctx.rotate(angle);
 ctx.shadowColor='#f5fffd';ctx.shadowBlur=14;ctx.fillStyle='rgba(218,255,250,.14)';
 ctx.strokeStyle='#f8fffe';ctx.lineWidth=1.8;ctx.fillRect(-gw/2,-gh/2,gw,gh);ctx.strokeRect(-gw/2,-gh/2,gw,gh);
 ctx.shadowBlur=0;
 for(let i=1;i<7;i++){const x=-gw/2+gw*i/7;line(x,-gh/2,x,gh/2,'rgba(255,255,255,.7)',.55)}
 for(let i=1;i<3;i++){const y=-gh/2+gh*i/3;line(-gw/2,y,gw/2,y,'rgba(255,255,255,.6)',.55)}
 ctx.restore();
 return {cx,cy,r,gx,gy,a,gw};
}

function burst(x,y,color,n=18,power=120){
 for(let i=0;i<n;i++){
  const a=Math.random()*TAU,s=power*(.25+Math.random());
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.65,max:1,color,r:.8+Math.random()*2.3});
 }
 if(particles.length>450)particles.splice(0,particles.length-450);
}

function goalEffect(team,b){
 if(elapsed-lastGoal<1.15)return;
 lastGoal=elapsed;scores[team]++;
 $('red').textContent=scores[0];$('blue').textContent=scores[1];
 const el=$('goal');el.textContent=team===0?'GOOOL! GALATASARAY':'GOOOL! BARCELONA';
 el.style.textShadow=team===0?'0 0 10px #fff,0 0 35px #ff3155':'0 0 10px #fff,0 0 35px #47baff';
 el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
 shake=9;flash=1;burst(b.x*W,b.y*H,team===0?'#ff415b':'#65d9ff',65,220);

 // Başlangıç hızını koru; her golde yapay hız ekleme.
 b.x=team===0?.35:.65;b.y=.5;
 const speed=Math.hypot(b.vx,b.vy);
 const dir=team===0?1:-1;
 b.vx=dir*Math.max(130,speed*.9);
 b.vy=(Math.random()-.5)*Math.max(40,speed*.45);
 b.trail=[];
}

function drawBall(b){
 const x=b.x*W,y=b.y*H,r=b.r;
 b.trail.forEach((p,i)=>{
  const f=(i+1)/b.trail.length;ctx.globalAlpha=f*.19;ctx.fillStyle=b.color;
  ctx.beginPath();ctx.arc(p.x,p.y,r*f*.75,0,TAU);ctx.fill();
 });
 ctx.globalAlpha=1;ctx.fillStyle='rgba(0,0,0,.42)';
 ctx.beginPath();ctx.ellipse(x+3,y+r*.95,r*1.18,r*.38,0,0,TAU);ctx.fill();
 const aura=ctx.createRadialGradient(x,y,r*.2,x,y,r*2.2);
 aura.addColorStop(0,b.color+'70');aura.addColorStop(1,b.color+'00');
 ctx.fillStyle=aura;ctx.beginPath();ctx.arc(x,y,r*2.2,0,TAU);ctx.fill();

 ctx.save();ctx.translate(x,y);ctx.rotate(b.spin);
 const grad=ctx.createRadialGradient(-r*.38,-r*.4,r*.05,0,0,r*1.15);
 grad.addColorStop(0,'#fff');grad.addColorStop(.28,'#e9eef0');grad.addColorStop(.63,'#9daab0');
 grad.addColorStop(.86,b.color);grad.addColorStop(1,b.dark);
 ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(0,0,r*.94,0,TAU);ctx.clip();
 for(let i=0;i<5;i++){
  const a=i*TAU/5;ctx.beginPath();ctx.moveTo(0,0);
  ctx.lineTo(Math.cos(a)*r*1.3,Math.sin(a)*r*1.3);
  ctx.lineTo(Math.cos(a+.43)*r*1.3,Math.sin(a+.43)*r*1.3);ctx.closePath();
  ctx.fillStyle=i%2===0?b.color:b.accent;ctx.fill();
 }
 ctx.restore();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=.8;
 ctx.beginPath();ctx.arc(0,0,r*.96,0,TAU);ctx.stroke();
 ctx.beginPath();ctx.arc(-r*.2,-r*.2,r*.38,Math.PI,Math.PI*1.55);
 ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
}

function updateBalls(dt,goal){
 const sec=dt/1000,{cx,cy,r}=geometry();

 balls.forEach(b=>{
  b.trail.push({x:b.x*W,y:b.y*H});if(b.trail.length>8)b.trail.shift();

  // Sürtünme kaldırıldı: toplar boşlukta kendi kendine yavaşlamaz.
  b.x+=b.vx*sec/W;b.y+=b.vy*sec/H;
  b.spin+=(Math.hypot(b.vx,b.vy)/100)*sec;

  const dx=b.x*W-cx,dy=b.y*H-cy,dist=Math.hypot(dx,dy),limit=r-b.r;
  if(dist>=limit&&dist>0){
   const nx=dx/dist,ny=dy/dist;
   const impactX=cx+nx*limit,impactY=cy+ny*limit;
   const angle=Math.atan2(dy,dx);
   const angleDiff=Math.atan2(Math.sin(angle-goal.a),Math.cos(angle-goal.a));
   const opening=Math.atan2((goal.gw*.5-b.r),r);

   // Gol için topun kale açıklığına doğru dışarı hareket etmesi şart.
   const outward=b.vx*nx+b.vy*ny;
   const insideGoal=Math.abs(angleDiff)<opening;
   if(insideGoal&&outward>0&&elapsed-lastGoal>1.15){
    goalEffect(b.team,b);return;
   }

   // Çemberden sekme: yalnızca normal hız bileşenini yansıt.
   b.x=impactX/W;b.y=impactY/H;
   if(outward>0){
    b.vx-=2*outward*nx;
    b.vy-=2*outward*ny;
    burst(impactX,impactY,'#f2fffe',5,35);
   }
  }
 });

 // Top-top çarpışması: yaklaşan toplar için elastik çarpışma.
 const a=balls[0],b=balls[1];
 const dx=(a.x-b.x)*W,dy=(a.y-b.y)*H,d=Math.hypot(dx,dy),min=a.r+b.r;
 if(d>0&&d<min){
  const nx=dx/d,ny=dy/d;
  const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
  if(rel<0){
   a.vx-=rel*nx;b.vx+=rel*nx;
   a.vy-=rel*ny;b.vy+=rel*ny;
   const push=(min-d)/2;
   a.x+=nx*push/W;b.x-=nx*push/W;
   a.y+=ny*push/H;b.y-=ny*push/H;
   if(elapsed-lastCollision>.22){
    lastCollision=elapsed;
    burst((a.x+b.x)*W/2,(a.y+b.y)*H/2,'#fff',10,55);
    shake=Math.max(shake,1.5);
   }
  }
 }
}

function drawParticles(dt){
 const sec=dt/1000;
 particles.forEach(p=>{
  p.x+=p.vx*sec;p.y+=p.vy*sec;
  p.vx*=Math.pow(.965,dt/16);p.vy*=Math.pow(.965,dt/16);p.life-=sec;
  ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
 });
 particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;ctx.shadowBlur=0;
}

function frame(now){
 // Sekme veya takılma sonrası devasa fizik adımını engelle.
 const dt=Math.min(last?now-last:16,20);
 last=now;elapsed+=dt/1000;
 ctx.save();
 if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-dt*.035)}
 background(elapsed*1000);
 const goal=drawArena(elapsed*1000);
 updateBalls(dt,goal);
 balls.forEach(drawBall);drawParticles(dt);ctx.restore();
 flash=Math.max(0,flash-dt*.002);
 const seconds=Math.floor(elapsed);
 $('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
 requestAnimationFrame(frame);
}

canvas.addEventListener('pointerdown',e=>burst(e.clientX,e.clientY,'#fff',16,100));
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
